name: TensorGuard QA

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ==========================================================================
  # BUILD CORRECTNESS - Must pass before any other checks
  # ==========================================================================
  build-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Verify Python Syntax (compileall)
      run: |
        python -m compileall src -q
        echo "✓ All Python files compile successfully"

    - name: Install Package
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[all]"
        echo "✓ Package installs successfully"

    - name: Verify Imports
      run: |
        python -c "from tensorguard.utils.config import settings; print('✓ Config imports')"
        python -c "from tensorguard.platform.enterprise import check_entitlement; print('✓ Enterprise imports')"
        python -c "from tensorguard.crypto.pqc import Kyber768; print('✓ PQC imports')"
        echo "✓ Core module imports successful"

  # ==========================================================================
  # SECURITY GATES - Production safety validation
  # ==========================================================================
  security-gates:
    runs-on: ubuntu-latest
    needs: build-check
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[all]"
        pip install pytest

    - name: Run Production Gate Tests
      env:
        PYTHONPATH: src
        TG_ENVIRONMENT: development
      run: |
        pytest tests/security/test_production_gates.py -v --tb=short
        echo "✓ Production security gates verified"

    - name: Verify Demo Mode Default
      run: |
        python -c "
import os
# Ensure TG_DEMO_MODE not set
os.environ.pop('TG_DEMO_MODE', None)
demo = os.getenv('TG_DEMO_MODE', 'false').lower() == 'true'
assert demo == False, 'Demo mode must default to OFF'
print('✓ Demo mode defaults to OFF')
"

    - name: Verify Enterprise Fail-Closed
      env:
        TG_COMMUNITY_MODE: "true"
        TG_ENVIRONMENT: production
      run: |
        python -c "
from tensorguard.platform.enterprise import check_entitlement
result = check_entitlement('test', 'hsm_integration')
assert result == False, 'Enterprise features must be denied in community mode'
print('✓ Enterprise entitlements fail-closed')
"

  # ==========================================================================
  # LINTING - Code quality
  # ==========================================================================
  lint:
    runs-on: ubuntu-latest
    needs: build-check
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install Linters
      run: |
        pip install ruff black mypy
        pip install -e ".[dev]"

    - name: Run Ruff
      run: |
        ruff check src/ --select E,W,F --ignore E501
        echo "✓ Ruff linting complete"

    - name: Check Formatting (Black)
      run: |
        black --check src/ --line-length 120
        echo "✓ Black formatting check complete"

    - name: Run MyPy Type Checking
      run: |
        mypy src/tensorguard --ignore-missing-imports --no-error-summary || true
        echo "✓ MyPy type checking complete (warnings only)"

  # ==========================================================================
  # FULL TEST SUITE
  # ==========================================================================
  qa-suite:
    runs-on: ubuntu-latest
    needs: [build-check, security-gates]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Build Frontend
      run: |
        cd frontend
        npm ci
        npm run build

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[all]"
        pip install pytest pytest-cov requests httpx coverage

    - name: Run Backend QA Suite with Coverage
      env:
        PYTHONPATH: src
        TG_ENVIRONMENT: development
        TG_DEMO_MODE: "false"
      run: |
        pytest tests/ --cov=src/tensorguard --cov-report=xml --cov-report=term --cov-fail-under=70 -v --tb=short

    - name: Upload Report Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: qa-report
        path: coverage.xml

  # ==========================================================================
  # E2E INTEGRATION TESTS - End-to-end smoke tests
  # ==========================================================================
  e2e-tests:
    runs-on: ubuntu-latest
    needs: [build-check, security-gates]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[all]"
        pip install pytest httpx

    - name: Run E2E Smoke Tests
      env:
        PYTHONPATH: src
        TG_ENVIRONMENT: development
        TG_DEMO_MODE: "false"
      run: |
        pytest tests/integration/test_e2e_smoke.py -v --tb=short
        echo "✓ E2E smoke tests passed"

    - name: Run Dashboard Stats Tests
      env:
        PYTHONPATH: src
        TG_ENVIRONMENT: development
      run: |
        pytest tests/integration/test_dashboard_stats.py -v --tb=short
        echo "✓ Dashboard stats tests passed"

    - name: Run Frontend Contract Tests
      env:
        PYTHONPATH: src
        TG_ENVIRONMENT: development
      run: |
        pytest tests/integration/test_frontend_contract.py -v --tb=short
        echo "✓ Frontend contract tests passed"

    - name: Run RBAC Isolation Tests
      env:
        PYTHONPATH: src
        TG_ENVIRONMENT: development
      run: |
        pytest tests/integration/test_rbac_isolation.py -v --tb=short
        echo "✓ RBAC isolation tests passed"

  # ==========================================================================
  # UNIT TESTS - Core functionality tests
  # ==========================================================================
  unit-tests:
    runs-on: ubuntu-latest
    needs: build-check

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[all]"
        pip install pytest

    - name: Run Feature Flags Tests
      env:
        PYTHONPATH: src
      run: |
        pytest tests/unit/test_feature_flags.py -v --tb=short

    - name: Run Worker Tests
      env:
        PYTHONPATH: src
      run: |
        pytest tests/unit/test_worker.py -v --tb=short

    - name: Run Agent Diagnostics Tests
      env:
        PYTHONPATH: src
      run: |
        pytest tests/unit/test_agent_diagnose.py -v --tb=short

  # ==========================================================================
  # DOCTOR SMOKE TEST - System health check
  # ==========================================================================
  doctor-smoke:
    runs-on: ubuntu-latest
    needs: build-check

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[all]"
        pip install pytest httpx requests

    - name: Run Doctor API Checks
      env:
        PYTHONPATH: src
        TG_ENVIRONMENT: development
      run: |
        python scripts/doctor_api_checks.py --dry-run || echo "Doctor checks require running server"

    - name: Run Edge Diagnose Script (Dry Run)
      run: |
        # Run without server - should show environment issues but not crash
        bash scripts/edge_diagnose.sh || true
        echo "✓ Edge diagnose script executed"

  # ==========================================================================
  # DEPENDENCY SECURITY AUDIT - Check for vulnerable dependencies
  # ==========================================================================
  security-audit:
    runs-on: ubuntu-latest
    needs: build-check
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install pip-audit
      run: |
        python -m pip install --upgrade pip
        pip install pip-audit

    - name: Run pip-audit
      continue-on-error: true  # Don't fail build, just report
      run: |
        pip install -e ".[all]"
        pip-audit --desc on --format markdown > audit-report.md || true
        echo "## Dependency Security Audit" >> $GITHUB_STEP_SUMMARY
        cat audit-report.md >> $GITHUB_STEP_SUMMARY || echo "No vulnerabilities found" >> $GITHUB_STEP_SUMMARY

    - name: Upload Audit Report
      uses: actions/upload-artifact@v4
      with:
        name: security-audit-report
        path: audit-report.md
        if-no-files-found: ignore

  # ==========================================================================
  # DOCKER BUILDS - Ensure container images build
  # ==========================================================================
  docker-builds:
    runs-on: ubuntu-latest
    needs: build-check
    steps:
    - uses: actions/checkout@v4

    - name: Build Platform Docker Image
      run: |
        docker build -f docker/platform/Dockerfile .

    - name: Build Bench Docker Image
      run: |
        docker build -f docker/bench/Dockerfile .

  # ==========================================================================
  # FINAL GATE - All tests must pass
  # ==========================================================================
  ci-gate:
    runs-on: ubuntu-latest
    needs: [build-check, security-gates, lint, qa-suite, e2e-tests, unit-tests, doctor-smoke]
    if: always()

    steps:
    - name: Check All Jobs
      run: |
        echo "Build Check: ${{ needs.build-check.result }}"
        echo "Security Gates: ${{ needs.security-gates.result }}"
        echo "Lint: ${{ needs.lint.result }}"
        echo "QA Suite: ${{ needs.qa-suite.result }}"
        echo "E2E Tests: ${{ needs.e2e-tests.result }}"
        echo "Unit Tests: ${{ needs.unit-tests.result }}"
        echo "Doctor Smoke: ${{ needs.doctor-smoke.result }}"

        if [[ "${{ needs.build-check.result }}" != "success" ]]; then
          echo "❌ Build check failed"
          exit 1
        fi

        if [[ "${{ needs.security-gates.result }}" != "success" ]]; then
          echo "❌ Security gates failed"
          exit 1
        fi

        if [[ "${{ needs.qa-suite.result }}" != "success" ]]; then
          echo "❌ QA suite failed"
          exit 1
        fi

        if [[ "${{ needs.e2e-tests.result }}" != "success" ]]; then
          echo "❌ E2E tests failed"
          exit 1
        fi

        if [[ "${{ needs.unit-tests.result }}" != "success" ]]; then
          echo "❌ Unit tests failed"
          exit 1
        fi

        echo "✅ All CI gates passed!"
