[pytest]
markers =
    unit: Unit tests
    integration: Integration tests
    e2e: End-to-end tests
    security: Security/Hardening tests
    perf: Performance sanity checks
    slow: Slow running tests
    crypto: Cryptographic operations tests
    privacy: Privacy features tests
    compliance: Compliance features tests

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Default options: strict markers, verbose, short traceback
addopts = --strict-markers -v --tb=short

# JUnit XML configuration (can be overridden via --junitxml flag)
junit_family = xunit2
junit_suite_name = TensorGuardFlow_TestSuite
junit_logging = all
junit_log_passing_tests = true

# Coverage configuration
[coverage:run]
source = src/tensorguard
branch = true
omit = */tests/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
show_missing = true
