# Continual Learning Vision Benchmark Suite
# Datasets: Split CIFAR-100, Split TinyImageNet, CORe50

suite: clvision

datasets:
  - name: split_cifar100
    num_tasks: 20
    classes_per_task: 5
    train_transforms: standard
    eval_transforms: standard
    download: true
    data_dir: ./data/cifar100

  - name: split_tinyimagenet
    num_tasks: 20
    classes_per_task: 10
    train_transforms: standard
    eval_transforms: standard
    download: true
    data_dir: ./data/tinyimagenet

  - name: core50
    num_tasks: 10
    classes_per_task: 5
    train_transforms: standard
    eval_transforms: standard
    download: true
    data_dir: ./data/core50

model:
  backbone: resnet18
  pretrained: true
  num_classes: 100
  hidden_dim: 512

training:
  epochs_per_task: 5
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer: adam
  scheduler: cosine

methods:
  - frozen
  - naive_finetune
  - tensorguard

seeds:
  - 42
  - 123
  - 456

device: cuda
output_dir: reports
fail_on_mock: true
